name: Run tests using Pytest

on:
  workflow_call:

  workflow_dispatch:

jobs:
  run-tests-pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Pytest for testing purposes
        run: pip install pytest pytest-cov

      - name: Install OpenVPN
        run: |
          sudo apt update
          sudo apt install -y openvpn openvpn-systemd-resolved

      - name: Connect to VPN and run tests
        run: |
          sudo openvpn --config ./.github/workflows/vpngate_public-vpn-187.opengw.net_udp_1195.ovpn --auth-user-pass <(echo -e "${{ secrets.OVPN_USERNAME }}\n${{ secrets.OVPN_PASSWORD }}") &
          sleep 10 # wait for VPN connection to establish
          coverage run -m pytest -v -s


      - name: Generate report using Coverage
        run: coverage report -m
